name: Release

on:
  push:
    branches: [main]

# Never run two releases against the same ref at once.
concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write # push the Version Packages branch, git tags, and GitHub releases
  pull-requests: write # open/update the Version Packages PR
  id-token: write # OIDC token for npm trusted publishing (no NPM_TOKEN)

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ripgrep backs @harpua/agent-tools' file-exploration + web-research tools;
      # the pre-publish `build lint test` gate below runs their specs, which
      # shell out to `rg` (matches ci.yml). Without it the release gate fails.
      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      # Enable Corepack so the pnpm version pinned by `packageManager` is used (matches ci.yml).
      - name: Enable Corepack
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # Trusted publishing (OIDC) needs npm CLI >= 11.5.1. `changeset publish` ->
      # `pnpm publish` delegates the upload to this npm binary, so it performs the OIDC
      # token exchange. Node 24 (.nvmrc) bundles npm 11.19, so we use it as-is instead of
      # pinning (a pin to 11.5.1 would downgrade it). Guard the two known failure modes
      # before anything publishes: an npm below the OIDC minimum, and an npm whose
      # provenance generator can't resolve its bundled `sigstore` module ("Cannot find
      # module 'sigstore'", which once aborted every publish mid-release).
      - name: Check npm for trusted publishing
        run: |
          NPM_DIR="$(npm root -g)/npm"
          node -e '
            const [dir, v] = process.argv.slice(1);
            const semver = require(dir + "/node_modules/semver");
            require.resolve("sigstore", { paths: [dir] });
            if (!semver.gte(v, "11.5.1")) {
              console.error(`npm ${v} is below 11.5.1, the trusted-publishing minimum`);
              process.exit(1);
            }
            console.log(`npm ${v}: trusted publishing OK, sigstore resolves`);
          ' "$NPM_DIR" "$(npm -v)"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Full root protocol before any publish so a broken Version Packages merge cannot ship.
      - name: Build, lint, and test
        run: pnpm turbo build lint test --force

      - name: Create Release Pull Request or publish
        uses: changesets/action@v1
        with:
          version: pnpm exec changeset version
          publish: pnpm exec changeset publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
